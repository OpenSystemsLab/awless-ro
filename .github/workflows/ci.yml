name: CI

# Pushes to master, and pull requests. Not every push: a release tag would run this
# a second time alongside the Release workflow, which repeats these gates itself, and a
# branch with an open pull request would be built twice, once for each event.
on:
  push:
    branches: [master]
  pull_request:

# The workflow only ever reads the repository. Without this block the token gets
# whatever the repository defaults happen to be, which for older repositories is
# read-write on everything.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is a movable label, and
      # whoever owns the action can repoint it at different code after review. The
      # trailing comment is the human-readable version; Dependabot keeps both in
      # step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # The runner image caches an older 1.26.x; without this a known stdlib fix is missed.
          check-latest: true

      - name: gofmt -s
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt -s clean:"
            echo "$unformatted"
            exit 1
          fi

      # Checks every module in the cache against go.sum. CONTRIBUTING forbids
      # disabling checksum verification; this is the part that notices if someone
      # does it anyway, or if a hash changes under us.
      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race

      # Generated code is regenerated and the tree must not move. This is what keeps
      # the generator the source of truth: a hand-edit to any gen_*.go fails here
      # instead of being silently erased by the next `make generate`.
      - name: generated files are up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated files are stale: run 'make generate' and commit the result"
            git status --porcelain
            git diff
            exit 1
          fi

      # Pinned rather than @latest, so that a new advisory database or a new tool
      # release cannot turn a green build red without a commit of ours.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The workflows are code too, and the only code here with no compiler and no
      # tests. actionlint catches what would otherwise be found by pushing and
      # waiting: a mistyped context, an expression that cannot evaluate, a shell
      # error inside a run block. Run as a module rather than through an action, so
      # there is one less third party in the chain.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # The same code on arm64, natively: release.go publishes darwin/arm64 and
  # linux/arm64 binaries, and they are cross-compiled on amd64, so without this job
  # neither the tests nor the binary would ever run on arm64. GitHub-hosted, free for
  # public repositories: ubuntu-24.04-arm is Linux on arm64, macos-latest Apple
  # Silicon. Only what depends on the architecture runs here; the other gates are
  # the same everywhere and run once, in build.
  arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: go test
        run: go test ./... -race

      - name: run the binary
        run: |
          go build -trimpath -o awless-ro .
          echo "built for $(go env GOOS)/$(go env GOARCH) on $(uname -sm)"
          ./awless-ro version
          ./awless-ro --help > /dev/null
