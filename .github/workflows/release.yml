name: Release

# Pushing a tag is the whole trigger. Building on a workstation meant the binaries
# people download came from one machine's toolchain and environment, which nobody but
# its owner can reproduce or audit; this builds them from the tag, in the open, with
# the logs kept.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the artefacts. Nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release.go asks git which tag it is on and derives the commit recorded in
          # the binary from it, so the tags and the full history have to be present.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # The runner image caches an older 1.26.x; without this a known stdlib fix is missed.
          check-latest: true

      # The gates from CI, repeated rather than assumed. A tag can be pushed to a
      # commit that never passed CI, and a release is the one artefact where finding
      # that out afterwards is expensive.
      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: build release artefacts
        run: go run release.go -tag "${GITHUB_REF_NAME}"

      # Proves the published checksums match the published files, before anyone
      # downloads them to find out.
      - name: verify checksums
        run: sha256sum -c SHA256SUMS

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "awless-ro ${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              awless-ro-*.tar.gz awless-ro-*.zip SHA256SUMS
          else
            # No hand-written notes for this tag: generate them from the commits
            # rather than publishing an empty release.
            gh release create "${GITHUB_REF_NAME}" \
              --title "awless-ro ${GITHUB_REF_NAME}" \
              --generate-notes \
              awless-ro-*.tar.gz awless-ro-*.zip SHA256SUMS
          fi

  # Points the Homebrew formula in theazz/homebrew-tap at the release just published,
  # so `brew upgrade` sees it without anyone remembering to. The checksums are read
  # from the SHA256SUMS attached to the release rather than passed along from the job
  # above: the formula then pins exactly the files people download.
  #
  # Pushing to another repository needs a credential of its own, because the workflow
  # token is scoped to this one. It is a deploy key with write access to the tap and
  # nothing else, stored here as the HOMEBREW_TAP_DEPLOY_KEY secret.
  homebrew:
    needs: release
    # A pre-release (v1.2.0-rc.1) is not what `brew install` should hand people. The
    # tap is theazz's, so a fork's release never tries to update it.
    if: ${{ github.repository == 'theazz/awless-ro' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: the deploy key is configured
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set; the formula was not updated. See CONTRIBUTING.md, releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir "${RUNNER_TEMP}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theazz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: update the formula
        run: |
          python3 .github/scripts/update_homebrew_formula.py \
            tap/Formula/awless-ro.rb "${GITHUB_REF_NAME#v}" "${RUNNER_TEMP}/SHA256SUMS"
          ruby -c tap/Formula/awless-ro.rb

      - name: commit and push to the tap
        working-directory: tap
        run: |
          if git diff --quiet; then
            echo "the formula already points at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "awless-ro ${GITHUB_REF_NAME#v}"
          git push
